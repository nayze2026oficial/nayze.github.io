<!-- CONTROLES TÁCTILES PARA MÓVILES -->
<div id="touch-controls" class="touch-overlay">
  <div class="dpad">
    <button id="btn-left" class="touch-btn">◀</button>
    <button id="btn-right" class="touch-btn">▶</button>
  </div>
  <div class="action-buttons">
    <button id="btn-punch" class="touch-btn action-btn">GOLPE (Z)</button>
    <button id="btn-kick" class="touch-btn action-btn">PATADA (X)</button>
  </div>
</div>
